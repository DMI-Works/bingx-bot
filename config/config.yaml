# Trading Bot Configuration

# Exchange Configuration

exchange:
  testnet: false

  websocket:
    enabled: true

trading:
  # Risk Management — акаунт-рівневий, застосовується до всіх стратегій
  # одразу (не per-strategy), тому лишається тут
  risk:
    max_open_positions: 3
    max_positions_per_symbol: 1
    max_total_risk_percent: 5.0
    max_consecutive_losses: 3
    # Скільки чекати після спрацювання ліміту max_consecutive_losses, перш
    # ніж лічильник збитків скинеться сам і бот знову зможе відкривати нові
    # позиції (раніше пауза була НАЗАВЖДИ, без цього — не міняй без потреби).
    consecutive_losses_cooldown_seconds: 60
    cooldown_after_trade_seconds: 1800
    # risk-based position sizing (см. ТЗ п.2 "risk_per_trade вместо fixed size")
    # ВЫКЛЮЧЕНО по умолчанию — включи явно (true) после того, как проверишь
    # risk_per_trade_percent на testnet: он заменит position_size стратегий
    # на quantity = (equity * risk_per_trade_percent%) / |entry - stop_loss|
    use_risk_based_sizing: false
    risk_per_trade_percent: 0.5

  # Filters — відбір монет для торгівлі, не залежить від стратегії.
  # СПІЛЬНИЙ пул для SMA/RejectionBlock/TrailingStop І OrderBookAnalyzer
  # (свідоме архітектурне рішення з ТЗ на OrderBook-модуль — один список
  # символів замість двох незалежних пулів з різними лімітами).
  filters:
    whitelist_symbols: []
    blacklist_symbols: []
    # ліміт з ТЗ на OrderBook-модуль (не більше 20 активних підписок).
    # На одному WS-з'єднанні це max_symbols трейд-підписок + max_symbols
    # depth-підписок = до 40 сумарно — з великим запасом нижче будь-якого
    # відомого ліміту BingX (офіційно задокументовано лише для spot: 200/з'єднання).
    max_symbols: 20
    min_price: {}
    max_price: {}
    min_volume_24h: 1000000
    max_spread_percent: 0.5
    refresh_interval_seconds: 3600
    # ротація монет (SymbolSelector.select) кожні refresh_interval_seconds:
    # - held (відкриті позиції) і whitelist_symbols — НІКОЛИ не чіпаються
    # - підписаний зараз символ БЕЗ позиції захищений від заміни, якщо
    #   давав сигнал за останні no_signal_replace_after_seconds
    # - "тихий" (без сигналу за цей час) непридбаний символ — замінюється
    #   свіжим кандидатом за 24h об'ємом
    # 1800с (30хв) — точне значення з ТЗ на OrderBook/SubscriptionManager
    # (раніше було 3600с, змінено при об'єднанні пулів)
    no_signal_replace_after_seconds: 1800

  # OrderBookAnalyzer (core/orderbook_analyzer.py) — детект "стін" і їх
  # пробою по partial book depth (@depth20). Сам по собі лише детектить +
  # логує + публікує WALL_DETECTED/WALL_BREAKOUT в EventBus (TelegramBot
  # завжди шле сповіщення). Чи призведе це до реальної угоди — залежить
  # від того, чи увімкнена WallBreakoutStrategy (див. нижче) через
  # Telegram /settings; сам OrderBookAnalyzer угод не відкриває.
  orderbook:
    enabled: true
    # рівень книги вважається "стіною", якщо його обсяг у wall_multiplier
    # разів більший за середній обсяг рівня в тому ж боці книги
    wall_multiplier: 5.0
    # додатковий абсолютний поріг обсягу (0 — вимкнено), щоб відсіяти
    # "стіни" на мікрооб'ємах у неліквідних інструментах
    min_wall_quantity: 0.0
    # наскільки близько (%) ціна має підійти до стіни, щоб почати
    # перевірку на пробій
    approach_threshold_pct: 0.5
    # скільки % початкового обсягу стіни має "з'їстись", щоб перетин
    # рівня рахувався пробоєм, а не шумом
    breakout_consumption_pct: 30.0
    # через скільки секунд неактуальна стіна прибирається зі стану,
    # якщо пробою так і не відбулось
    wall_stale_seconds: 300.0

  # ВАЖНО: main.py читает этот блок как config.get('trading.trailing_stop'),
  # поэтому он ОБЯЗАН быть вложен под trading: (а не на верхнем уровне, как
  # было раньше — из-за этого TrailingStopManager получал config={} и всегда
  # работал на хардкод-дефолтах, полностью игнорируя эти настройки).
  # Имена параметров ниже соответствуют реальным полям, которые читает
  # TrailingStopManager.__init__ (core/risk/trailing_stop_manager.py) —
  # старые ключи (breakeven_trigger_percent, trail_trigger_r, trail_distance_r,
  # min_move_percent, min_seconds_between_moves) в коде НЕ используются нигде.
  trailing_stop:
    enabled: true
    # пороги перестановки SL, заданы в %ROI (как показывает биржа) —
    # переводятся в %price делением на leverage конкретной позиции
    trail_levels_percent: [ 5.0, 8.0, 16.0, 32.0, 64.0, 120, 200.0, 250.0, 300.0, 350.0, 400.0]
    # буфер (в %ROI) — насколько SL отстаёт от достигнутого уровня
    dynamic_stop_buffer_percent: 0.5
    # буфер не может съедать больше этой доли расстояния до уровня
    max_buffer_fraction_of_level: 0.8

# Logging Configuration
logging:
  level: "INFO"
  file: "logs/trading_bot.log"
  max_bytes: 10485760
  backup_count: 5

# Telegram Configuration
# bot_token / chat_id сюда НЕ выносятся — main.py читает их напрямую из
# TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID в .env (как и с ключами BingX),
# дублирующие поля в YAML реально не читались.
telegram:
  enabled: true
  # notifications.* тут раніше був, але TelegramBot ніколи його не читав
  # (notifications_enabled захардкожений як True) — прибрано, щоб не
  # вводити в оману.

webapp:
  enabled: true
  port: 8000