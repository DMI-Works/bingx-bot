# Trading Bot Configuration

# Exchange Configuration
exchange:
  name: "bingx"
  api_key: "${BINGX_API_KEY}"
  api_secret: "${BINGX_API_SECRET}"
  testnet: true

  websocket:
    enabled: true
    reconnect_interval: 5
    ping_interval: 20
    max_reconnect_attempts: 10

  rest:
    timeout: 30
    max_retries: 3
    retry_delay: 1

# Trading Configuration — тільки базові / глобальні налаштування.
# Параметри конкретних стратегій (sma_period, stop_loss, take_profit,
# rejection_block, position_size, leverage і т.д.) тепер зберігаються
# в БД (таблиця strategy_settings) — див. core/strategies/defaults.py
# для заводських значень і core/database/strategy_settings.py для API
# читання/редагування/скидання.
trading:
  enabled: true
  direction: "both"  # long, short, both

  # Risk Management — акаунт-рівневий, застосовується до всіх стратегій
  # одразу (не per-strategy), тому лишається тут
  risk:
    max_open_positions: 3
    max_positions_per_symbol: 1
    max_total_risk_percent: 5.0
    max_consecutive_losses: 3
    cooldown_after_trade_seconds: 60

  # Filters — відбір монет для торгівлі, не залежить від стратегії
  filters:
    whitelist_symbols: ["BSB-USDT", "CLO-USDT", "VINE-USDT", "DEXE-USDT", "BEAT-USDT", "XPIN-USDT"]
    blacklist_symbols: []
    max_symbols: 7
    min_price: {}
    max_price: {}
    min_volume_24h: 1000000
    max_spread_percent: 0.5
    min_atr: 0
    refresh_interval_seconds: 3600

  time_filters:
    enabled: false
    allowed_hours: []
    timezone: "UTC"

# Strategy Configuration — лише перелік, які стратегії запускати.
# Їхні параметри — в БД.
strategies:
  enabled: ['SimpleMovingAverageStrategy', 'RejectionBlockStrategy']

# Database Configuration
database:
  path: "data/trading_bot.db"
  backup_interval_hours: 6

# Logging Configuration
logging:
  level: "INFO"
  file: "logs/trading_bot.log"
  max_bytes: 10485760
  backup_count: 5

# Telegram Configuration
telegram:
  enabled: true
  bot_token: "${TELEGRAM_BOT_TOKEN}"
  chat_id: "${TELEGRAM_CHAT_ID}"

  notifications:
    position_opened: true
    position_closed: true
    take_profit_hit: true