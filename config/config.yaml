# Trading Bot Configuration

# Exchange Configuration

exchange:
  testnet: true

  websocket:
    enabled: true

trading:
  # Risk Management — акаунт-рівневий, застосовується до всіх стратегій
  # одразу (не per-strategy), тому лишається тут
  risk:
    max_open_positions: 3
    max_positions_per_symbol: 1
    max_total_risk_percent: 5.0
    # Скільки збиткових угод ПОСПІЛЬ по одній монеті — і ця монета ПРИБИРАЄТЬСЯ
    # з торгівлі (чорний список + відписка від WS). Не пауза по таймеру: назад
    # її повертають вручну (міні-апп → Монети → чорний список). 0 = вимкнено.
    # Серія рахується окремо по кожній монеті, інші монети не зачіпаються.
    # Було 3: при WR ~50% три мінуси поспіль по монеті — звичайна справа, і
    # чорний список поступово з'їдав усі ліквідні монети (CLAUS, W, GTC, POL, NEAR
    # за 09-14.10). 5 поспіль при WR 50% — ~3% ймовірності на серію.
    max_consecutive_losses: 5
    # risk-based position sizing (см. ТЗ п.2 "risk_per_trade вместо fixed size")
    # ВЫКЛЮЧЕНО по умолчанию — включи явно (true) после того, как проверишь
    # risk_per_trade_percent на testnet: он заменит position_size стратегий
    # на quantity = (equity * risk_per_trade_percent%) / |entry - stop_loss|
    use_risk_based_sizing: false
    risk_per_trade_percent: 0.5
    # Предохранитель: stop_loss_streak_limit стоп-лоссов В МИНУС подряд за
    # stop_loss_streak_window_hours часов -> новые входы блокируются на
    # stop_loss_block_hours часов (по всему аккаунту, для всех стратегий;
    # открытые позиции продолжают сопровождаться). Любое закрытие не по
    # стопу в минус (стоп в плюс, TP, ручное) серию обрывает. 0 = выключено.
    # Стеля маржі однієї угоди (% від equity) для угод із risk_percent зі
    # стратегії (TrendSupertrendStrategy). Без неї тісний стоп роздуває
    # позицію до майже всього депозиту. 0 = вимкнено.
    max_margin_percent_per_trade: 5.0
    # Комісія taker однієї сторони: у risk-sizing закладається round-trip
    # (2 * taker_fee_rate * ціна) на одиницю, щоб реальний збиток не
    # перевищував заплановані risk_percent на тісних стопах.
    taker_fee_rate: 0.0005
    # Було 3 / 8 год: на тестнеті 10-11.10 запобіжник двічі зупиняв входи на
    # 8 годин — головна причина "бот торгує рідко". Для тестнету (збір даних)
    # м'якше; перед реальними грошима — переглянути.
    stop_loss_streak_limit: 5
    stop_loss_streak_window_hours: 24
    stop_loss_block_hours: 2

  # Filters — відбір монет для торгівлі, не залежить від стратегії.
  # СПІЛЬНИЙ пул для стратегій, TrailingStop І OrderBookAnalyzer
  # (свідоме архітектурне рішення з ТЗ на OrderBook-модуль — один список
  # символів замість двох незалежних пулів з різними лімітами).
  filters:
    whitelist_symbols: []
    blacklist_symbols: []
    # ліміт з ТЗ на OrderBook-модуль (не більше 20 активних підписок).
    # На одному WS-з'єднанні це max_symbols трейд-підписок + max_symbols
    # depth-підписок = до 40 сумарно — з великим запасом нижче будь-якого
    # відомого ліміту BingX (офіційно задокументовано лише для spot: 200/з'єднання).
    max_symbols: 20
    min_price: {}
    max_price: {}
    # Було 1 000 000: на тонких монетах (CLAUS, CYBERLEEK, W, ...) стоп-маркет
    # прослизав на 0.5-3.7% замість 1% стопу (-74% і -94% ROE на W-USDT), а
    # стопи вибивало за 3-7 секунд. 20M — як у TrendSupertrendStrategy.
    min_volume_24h: 20000000
    max_spread_percent: 0.5
    # Префікси не-крипто контрактів BingX (NCFX — форекс, NCCO — сировина,
    # NCSK — акції, NCSI — індекси): торгуються не цілодобово й займали 5 з 20
    # слотів пулу. Whitelist цей фільтр обходить.
    excluded_symbol_prefixes: "NCFX,NCCO,NCSK,NCSI"
    # Порядок відбору в пул серед монет, що пройшли фільтри:
    # volatility — за 24h діапазоном (high-low)/low: "живі" монети, де частіше
    # бувають пробої; volume — за 24h оборотом (стара поведінка).
    rank_by: volatility
    # Монета, яку прибрали як "тиху" (без сигналу rotation_interval_seconds),
    # стільки секунд стоїть у кінці черги — ротація пробує нові монети, а не
    # гойдається між тими самими (повертається, лише якщо інших не вистачає).
    quiet_cooldown_seconds: 7200
    # ОДНЕ значення на дві ролі одразу (раніше було 2 окремих: refresh_interval_seconds
    # і no_signal_replace_after_seconds — не збігалися між собою: рефреш раз на
    # годину, а поріг "тиші" — 30 хв, тобто тиха монета фактично чекала заміни
    # до 90 хв замість заявлених 30). Тепер один інтервал:
    # - раз на стільки секунд SymbolSelector перераховує список символів
    # - і він же — поріг "без сигналу X секунд" для визначення "тихої" монети
    rotation_interval_seconds: 1800

  # OrderBookAnalyzer (core/orderbook_analyzer.py) — детект "стін" і їх
  # пробою по partial book depth (@depth20). Сам по собі лише детектить +
  # логує + публікує WALL_DETECTED/WALL_BREAKOUT в EventBus (TelegramBot
  # завжди шле сповіщення). Чи призведе це до реальної угоди — залежить
  # від того, чи увімкнена WallBreakoutStrategy (див. нижче) через
  # Telegram /settings; сам OrderBookAnalyzer угод не відкриває.
  orderbook:
    enabled: true
    # рівень книги вважається "стіною", якщо його обсяг у wall_multiplier
    # разів більший за середній обсяг рівня в тому ж боці книги
    wall_multiplier: 5.0
    # додатковий абсолютний поріг обсягу (0 — вимкнено), щоб відсіяти
    # "стіни" на мікрооб'ємах у неліквідних інструментах
    min_wall_quantity: 0.0
    # наскільки близько (%) ціна має підійти до стіни, щоб почати
    # перевірку на пробій
    approach_threshold_pct: 0.5
    # скільки % початкового обсягу стіни має "з'їстись", щоб перетин
    # рівня рахувався пробоєм, а не шумом
    breakout_consumption_pct: 30.0
    # через скільки секунд неактуальна стіна прибирається зі стану,
    # якщо пробою так і не відбулось
    wall_stale_seconds: 300.0

  # ВАЖНО: main.py читает этот блок как config.get('trading.trailing_stop'),
  # поэтому он ОБЯЗАН быть вложен под trading: (а не на верхнем уровне, как
  # было раньше — из-за этого TrailingStopManager получал config={} и всегда
  # работал на хардкод-дефолтах, полностью игнорируя эти настройки).
  # Имена параметров ниже соответствуют реальным полям, которые читает
  # TrailingStopManager.__init__ (core/risk/trailing_stop_manager.py) —
  # старые ключи (breakeven_trigger_percent, trail_trigger_r, trail_distance_r,
  # min_move_percent, min_seconds_between_moves) в коде НЕ используются нигде.
  trailing_stop:
    enabled: true
    # Пороги перестановки SL (trail_levels_percent) тут больше НЕ задаются:
    # они — параметр стратегии (DEFAULT_PARAMS в wall_breakout_strategy.py),
    # меняются из мини-аппа (Настройки -> стратегия).
    # буфер (в %ROI) — насколько SL отстаёт от достигнутого уровня
    dynamic_stop_buffer_percent: 0.5
    # буфер не может съедать больше этой доли расстояния до уровня
    max_buffer_fraction_of_level: 0.8
    # Режим atr_3step (TrendSupertrendStrategy): комиссия одной стороны
    # (taker). Безубыток = entry ± 2 * taker_fee_rate * entry (вход + выход).
    taker_fee_rate: 0.0005

# Logging Configuration
logging:
  level: "INFO"
  file: "logs/trading_bot.log"
  max_bytes: 10485760
  backup_count: 5

# Telegram Configuration
# bot_token / chat_id сюда НЕ выносятся — main.py читает их напрямую из
# TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID в .env (как и с ключами BingX),
# дублирующие поля в YAML реально не читались.
telegram:
  enabled: true
  # notifications.* тут раніше був, але TelegramBot ніколи його не читав
  # (notifications_enabled захардкожений як True) — прибрано, щоб не
  # вводити в оману.

webapp:
  enabled: true
  port: 8000

# Додаткова аналітика угод (колекція trade_analytics).
analytics:
  enabled: true
  # як часто (сек) дописувати MFE/MAE відкритої угоди в БД; фінальний запис —
  # завжди при закритті
  excursion_flush_seconds: 30
  # Траєкторія угоди (excursion.path): нова точка, коли рух ціни від входу
  # змінився на path_step_pct (% ціни). Довгі угоди проріджуються до
  # path_max_points. Потрібна для scripts/trade_report.py (симуляція SL/TP).
  path_step_pct: 0.05
  path_max_points: 2000
